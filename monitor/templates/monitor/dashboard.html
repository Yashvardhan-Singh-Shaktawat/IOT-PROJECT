<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEMS | Solar Monitor</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary-bg: #f3f4f6;
            --card-bg: #ffffff;
            --solar-color: #f59e0b;
            --grid-color: #3b82f6;
            --bat-color: #10b981;
            --text-dark: #1f2937;
        }
        body { background-color: var(--primary-bg); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { height: 100vh; position: fixed; top: 0; left: 0; width: 250px; background: #111827; color: white; padding: 20px; }
        .main-content { margin-left: 250px; padding: 30px; }
        .nav-link { color: #9ca3af; padding: 10px; border-radius: 5px; margin-bottom: 5px; text-decoration: none; display: block; cursor: pointer; }
        .nav-link:hover, .nav-link.active { background-color: #374151; color: white; }
        .nav-link i { margin-right: 10px; width: 20px; }
        .stat-card {
            background: var(--card-bg); border-radius: 12px; padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border-left: 5px solid transparent; transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-card.solar { border-left-color: var(--solar-color); }
        .stat-card.grid { border-left-color: var(--grid-color); }
        .stat-card.battery { border-left-color: var(--bat-color); }
        .stat-title { font-size: 0.85rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .stat-value { font-size: 2rem; font-weight: 700; color: var(--text-dark); margin: 10px 0; }
        .icon-box { float: right; font-size: 1.5rem; opacity: 0.2; }
        .progress { height: 10px; border-radius: 5px; background-color: #e5e7eb; margin-top: 10px;}
        .btn-mode { transition: all 0.2s; border-width: 1px; opacity: 0.7; }
        .btn-mode:hover { transform: translateY(-2px); opacity: 1; }
        .mode-active { border-width: 2px !important; opacity: 1 !important; background-color: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .status-badge {
            font-size: 0.9em; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
            padding: 10px; border-radius: 6px; margin-bottom: 20px; display: block; box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
        }
        .chart-container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-top: 30px; }
        @media (max-width: 768px) { .sidebar { width: 100%; height: auto; position: relative; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="sidebar d-flex flex-column">
        <h3 class="mb-4"><i class="fas fa-bolt text-warning"></i> SEMS</h3>
        <nav class="nav flex-column">
            <a href="{% url 'dashboard' %}" class="nav-link active"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="{% url 'economics' %}" class="nav-link"><i class="fas fa-rupee-sign"></i> Financial Report</a>
            <a class="nav-link" onclick="loadChart('week')" style="cursor:pointer"><i class="fas fa-calendar-week"></i> Weekly View</a>
            <a href="/admin/" class="nav-link mt-auto"><i class="fas fa-cog"></i> System Admin</a>
        </nav>
        <div class="mt-auto text-muted small">Last Sync: <span id="last-sync">--:--</span></div>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div><h2 class="fw-bold">Energy Overview</h2><p class="text-muted">Real-time Solar & Grid Monitoring System</p></div>
            <div class="badge bg-success p-2" id="status-badge"><i class="fas fa-wifi"></i> System Online</div>
        </div>

        <div class="row g-4">
            <div class="col-md-3">
                <div class="stat-card solar">
                    <div class="icon-box text-warning"><i class="fas fa-sun fa-2x"></i></div>
                    <div class="stat-title">Solar Gen</div>
                    <div class="stat-value"><span id="solar">0.0</span> <span class="fs-6 text-muted">W</span></div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card battery">
                    <div class="icon-box text-success"><i class="fas fa-car-battery fa-2x"></i></div>
                    <div class="stat-title">Battery</div>
                    <div class="stat-value"><span id="bat_pct">0</span> <span class="fs-6 text-muted">%</span></div>
                    <div class="progress"><div id="bat-bar" class="progress-bar bg-success" style="width: 0%"></div></div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card grid">
                    <div class="icon-box text-primary"><i class="fas fa-network-wired fa-2x"></i></div>
                    <div class="stat-title">Grid Import</div>
                    <div class="stat-value"><span id="grid">0.0</span> <span class="fs-6 text-muted">W</span></div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="icon-box text-danger"><i class="fas fa-lightbulb fa-2x"></i></div>
                    <div class="stat-title">Consumption</div>
                    <div class="stat-value"><span id="bat_out">0.0</span> <span class="fs-6 text-muted">W</span></div>
                </div>
            </div>
        </div>

        <div class="row mt-2">
            <div class="col-lg-8">
                <div class="chart-container">
                    <div class="d-flex justify-content-between mb-3">
                        <h5 class="fw-bold">Power Trends</h5>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-secondary" onclick="loadChart('day')">Day</button>
                            <button class="btn btn-outline-secondary" onclick="loadChart('week')">Week</button>
                        </div>
                    </div>
                    <canvas id="energyChart" height="130"></canvas>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="chart-container h-100">
                    <h5 class="fw-bold mb-3">System Control</h5>
                    <div id="status-indicator" class="status-badge alert-secondary text-center"><i class="fas fa-spinner fa-spin"></i> SYNCING...</div>
                    <p class="text-muted small mb-3">Select Operation Mode:</p>
                    
                    <button id="btn-mode-home" class="btn btn-mode w-100 mb-2 p-3 text-start border shadow-sm" onclick="setMode('home')">
                        <div class="d-flex align-items-center">
                            <div class="icon-box me-3 text-danger"><i class="fas fa-home fa-2x"></i></div>
                            <div><h6 class="mb-0 fw-bold">Power Home</h6><small class="text-muted">Solar -> Home</small></div>
                        </div>
                    </button>

                    <button id="btn-mode-sell" class="btn btn-mode w-100 mb-2 p-3 text-start border shadow-sm" onclick="setMode('grid_sell')">
                        <div class="d-flex align-items-center">
                            <div class="icon-box me-3 text-primary"><i class="fas fa-network-wired fa-2x"></i></div>
                            <div><h6 class="mb-0 fw-bold">Sell to Grid</h6><small class="text-muted">Solar -> Grid</small></div>
                        </div>
                    </button>

                    <button id="btn-mode-import" class="btn btn-mode w-100 mb-2 p-3 text-start border shadow-sm" onclick="setMode('grid_import')">
                        <div class="d-flex align-items-center">
                            <div class="icon-box me-3 text-warning"><i class="fas fa-plug fa-2x"></i></div>
                            <div><h6 class="mb-0 fw-bold">Use Main Grid</h6><small class="text-muted">Grid -> Home</small></div>
                        </div>
                    </button>

                    <button id="btn-mode-charge" class="btn btn-mode w-100 mb-2 p-3 text-start border shadow-sm" onclick="setMode('charge')">
                        <div class="d-flex align-items-center">
                            <div class="icon-box me-3 text-success"><i class="fas fa-battery-charging fa-2x"></i></div>
                            <div><h6 class="mb-0 fw-bold">Charge Battery</h6><small class="text-muted">All Output OFF</small></div>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateDashboard() {
            fetch('/api/latest/')
                .then(r => r.json())
                .then(data => {
                    if(data.error) return;
                    document.getElementById('solar').innerText = data.solar.toFixed(1);
                    document.getElementById('grid').innerText = data.grid.toFixed(1);
                    document.getElementById('bat_out').innerText = data.battery_out.toFixed(1);
                    document.getElementById('bat_pct').innerText = Math.round(data.battery_pct);
                    document.getElementById('last-sync').innerText = data.time;

                    const bar = document.getElementById('bat-bar');
                    bar.style.width = data.battery_pct + "%";
                    if(data.battery_pct < 20) bar.className = "progress-bar bg-danger";
                    else if(data.battery_pct < 50) bar.className = "progress-bar bg-warning";
                    else bar.className = "progress-bar bg-success";

                    const badge = document.getElementById('status-indicator');
                    resetButtons();

                    if (data.home_status) {
                        badge.className = "status-badge alert alert-danger text-center";
                        badge.innerHTML = '<i class="fas fa-sun"></i> SOLAR POWERING HOME';
                        highlightBtn('btn-mode-home', 'border-danger');
                    } else if (data.grid_status) {
                        badge.className = "status-badge alert alert-primary text-center";
                        badge.innerHTML = '<i class="fas fa-coins"></i> SELLING TO GRID';
                        highlightBtn('btn-mode-sell', 'border-primary');
                    } else if (data.import_status) {
                        badge.className = "status-badge alert alert-warning text-center";
                        badge.innerHTML = '<i class="fas fa-plug"></i> RUNNING ON GRID';
                        highlightBtn('btn-mode-import', 'border-warning');
                    } else {
                        badge.className = "status-badge alert alert-success text-center";
                        badge.innerHTML = '<i class="fas fa-battery-charging"></i> CHARGING BATTERY';
                        highlightBtn('btn-mode-charge', 'border-success');
                    }
                }).catch(err => console.error(err));
        }

        function highlightBtn(id, colorClass) {
            const btn = document.getElementById(id);
            btn.classList.add(colorClass); btn.classList.add('mode-active');
        }

        function resetButtons() {
            ['btn-mode-home', 'btn-mode-sell', 'btn-mode-import', 'btn-mode-charge'].forEach(id => {
                document.getElementById(id).className = "btn btn-mode w-100 mb-2 p-3 text-start border shadow-sm"; 
            });
        }

        function setMode(modeName) {
            document.getElementById('status-indicator').innerHTML = '<i class="fas fa-sync fa-spin"></i> SWITCHING...';
            fetch(`/api/toggle/?mode=${modeName}`).then(r => r.json()).then(data => { updateDashboard(); });
        }

        let myChart = null;
        function loadChart(period) {
            fetch(`/api/history/?period=${period}`).then(r => r.json()).then(data => {
                const ctx = document.getElementById('energyChart').getContext('2d');
                if (myChart) myChart.destroy();
                let gradientSolar = ctx.createLinearGradient(0, 0, 0, 400);
                gradientSolar.addColorStop(0, 'rgba(245, 158, 11, 0.5)'); gradientSolar.addColorStop(1, 'rgba(245, 158, 11, 0.0)');
                let gradientGrid = ctx.createLinearGradient(0, 0, 0, 400);
                gradientGrid.addColorStop(0, 'rgba(59, 130, 246, 0.5)'); gradientGrid.addColorStop(1, 'rgba(59, 130, 246, 0.0)');

                myChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [
                            { label: 'Solar Gen (W)', data: data.solar, borderColor: '#f59e0b', backgroundColor: gradientSolar, fill: true, tension: 0.4 },
                            { label: 'Grid Usage (W)', data: data.grid, borderColor: '#3b82f6', backgroundColor: gradientGrid, fill: true, tension: 0.4 }
                        ]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true, grid: { color: '#f3f4f6' } }, x: { grid: { display: false } } } }
                });
            });
        }
        setInterval(updateDashboard, 2000); updateDashboard(); loadChart('day');
    </script>
</body>
</html>
